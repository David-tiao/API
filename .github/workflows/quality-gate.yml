name: API Extractor reproducible quality gate
on:
  push:
    branches: [main]
    # Check every main commit, including documentation-only changes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked top-level dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm ci --ignore-scripts
      - name: Require no internal assessment material in current commit
        run: |
          if git ls-files | grep -E '^RECRUIT-2026-.*\.md$'; then
            echo 'Internal material unexpectedly tracked' >&2
            exit 1
          fi
          git check-ignore -q RECRUIT-2026-synthetic.md
      - name: Python, Bash and JavaScript syntax
        run: |
          python -m compileall -q api_extractor tests
          find scripts -maxdepth 1 -name '*.sh' -print0 | while IFS= read -r -d '' file; do bash -n "$file"; done
          node --check tools/js_ast_analyzer.cjs
          python -m api_extractor.cli --help
      - name: Entire repository offline pytest
        run: python -m pytest -q -o addopts='' --disable-warnings

  docker-synthetic:
    needs: offline-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - name: Build actual evaluation image within 15 minutes
        run: |
          start="$SECONDS"
          timeout --signal=TERM --kill-after=10s 900s docker build --pull -t api-extractor-ci:latest .
          echo "Docker build elapsed: $((SECONDS-start)) seconds"
          size="$(docker image inspect api-extractor-ci:latest --format '{{.Size}}')"
          echo "Docker image bytes: $size"
          test "$size" -le $((6*1024*1024*1024))
      - name: Isolated browser + live HTTP fixture, two-run acceptance
        run: bash scripts/ci_docker_smoke.sh api-extractor-ci:latest
