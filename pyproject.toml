[project]
name = "api-extractor"
version = "0.1.0"
description = "A scope-constrained, reproducible frontend API discovery tool"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "beautifulsoup4==4.13.4",
  "playwright==1.55.0",
  "jsonschema==4.25.1",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
